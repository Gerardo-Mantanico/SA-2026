spring.application.name=jwt-backend
server.port=8082

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/jwt_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Custom JWT configuration
app.jwt.secret=sa2026_super_secret_jwt_sign_key_must_be_long_enough_to_satisfy_256_bits_length_requirement
# 1 minute access token expiration (60000 ms) to demo refresh flow easily
app.jwt.access-expiration-ms=60000
# 24 hours refresh token expiration (86400000 ms)
app.jwt.refresh-expiration-ms=86400000

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
