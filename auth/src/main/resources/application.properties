spring.application.name=demo

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5436/sa-2026
spring.datasource.username=sa-root
spring.datasource.password=sa-2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Session / HTTP Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# Custom JWT configuration
# HS256 requires a 256-bit (32-byte) key. This string is long enough.
app.jwt.secret=sa2026_super_secret_jwt_sign_key_must_be_long_enough_to_satisfy_256_bits_length_requirement
# 1 minute access token expiration (60000 ms) to demo refresh flow easily
app.jwt.access-expiration-ms=60000
# 24 hours refresh token expiration (86400000 ms)
app.jwt.refresh-expiration-ms=86400000

# Server port
server.port=8080
